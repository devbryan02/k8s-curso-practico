apiVersion: v1
kind: Pod
metadata:
  name: consumer
  namespace: demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "env | sort; echo ----; cat /config/application.properties; sleep 3600"]
      envFrom:
        - configMapRef:
            name: app-config
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_PASSWORD
      volumeMounts:
        - name: cfg
          mountPath: /config
          readOnly: true
        - name: sec
          mountPath: /secrets
          readOnly: true
  volumes:
    - name: cfg
      configMap:
        name: app-config
        items:
          - key: application.properties
            path: application.properties
    - name: sec
      secret:
        secretName: app-secret
