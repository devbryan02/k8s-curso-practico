replicaCount: 2

image:
  repository: products-api
  tag: "1.0.0"
  pullPolicy: IfNotPresent

# Variables no sensibles (van a un ConfigMap -> envFrom)
config:
  DB_URL: "jdbc:mysql://mysql:3306/productsdb?useSSL=false&allowPublicKeyRetrieval=true"
  JWK_SET_URI: "http://keycloak:8080/realms/curso/protocol/openid-connect/certs"

# Credenciales de BD: el chart NO crea el Secret, referencia uno existente
db:
  secretName: mysql-secret
  userKey: MYSQL_USER
  passwordKey: MYSQL_PASSWORD

service:
  port: 8080

ingress:
  enabled: true
  className: nginx
  host: api.localtest.me
  annotations: {}

resources:
  requests:
    cpu: 200m
    memory: 384Mi
  limits:
    memory: 768Mi

# Crea un ServiceMonitor (requiere los CRDs de Prometheus Operator - módulo 11)
serviceMonitor:
  enabled: false
  interval: 15s
