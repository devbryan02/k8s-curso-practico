apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: products-api
  namespace: argocd
spec:
  project: default
  source:
    # TODO: cambia por TU repositorio (donde subiste este curso)
    repoURL: https://github.com/TU_USUARIO/kubernetes-kind-curso.git
    targetRevision: main
    path: 10-helm/charts/products-api
    helm:
      releaseName: products-api
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
