apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer-{{ .Values.deployerClusterRole }}
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Values.deployerClusterRole }}
  apiGroup: rbac.authorization.k8s.io
