apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch-recursos
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: batch
  template:
    metadata:
      labels:
        app: batch
    spec:
      containers:
        - name: batch
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: "64"
              memory: 128Gi
