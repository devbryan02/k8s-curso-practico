apiVersion: apps/v1
kind: Deployment
metadata:
  name: site
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: site
  template:
    metadata:
      labels:
        app: site
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: site
  namespace: lab
spec:
  selector:
    app: site
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: site
  namespace: lab
spec:
  ingressClassName: nginx
  rules:
    - host: site.lab.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: site
                port:
                  number: 8080
